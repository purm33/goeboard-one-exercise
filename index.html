<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>선대칭 지오보드 대결</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 위에 설정 줄(선생님이 잠글 수 있음), 가운데 시계와 시작 버튼과 순위, 아래에 지오보드를 인원수에 맞춰 격자로 배치한다. 좁은 화면에서는 위아래로 쌓인다. */
:root {
  --paper: #f2f5f8;
  --card: #ffffff;
  --ink: #16212c;
  --muted: #566574;
  --line: #d3dce5;
  --board: #d7e2ec;
  --peg: #7f92a5;
  --axis: #d6336c;
  --p0: #d9480f;
  --p1: #1971c2;
  --p2: #6741d9;
  --p3: #0b7285;
  --p4: #8f6a00;
  --p5: #8a5a3c;
  --pf: #ffffff;
  --ok: #2b8a3e;
  --bad: #c92a2a;
  --font-display: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-body: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1620;
    --card: #16212d;
    --ink: #e9eff5;
    --muted: #9aabbb;
    --line: #2b3a49;
    --board: #1d2b3a;
    --peg: #6f8499;
    --axis: #f06595;
    --p0: #ff922b;
    --p1: #4dabf7;
    --p2: #9775fa;
    --p3: #3bc9db;
    --p4: #fcc419;
    --p5: #e0a370;
    --pf: #0e1620;
    --ok: #69db7c;
    --bad: #ff8787;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1620;
  --card: #16212d;
  --ink: #e9eff5;
  --muted: #9aabbb;
  --line: #2b3a49;
  --board: #1d2b3a;
  --peg: #6f8499;
  --axis: #f06595;
  --p0: #ff922b;
  --p1: #4dabf7;
  --p2: #9775fa;
  --p3: #3bc9db;
  --p4: #fcc419;
  --p5: #e0a370;
  --pf: #0e1620;
  --ok: #69db7c;
  --bad: #ff8787;
  color-scheme: dark;
}

[hidden] { display: none !important; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  padding-block: 20px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.app.wide { max-width: 1480px; }

/* 위쪽 제목과 설정 */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.title { min-width: 0; }
h1 { margin: 0; font: 400 32px/1.15 var(--font-display); text-wrap: balance; }
.title p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.ctl { min-width: 0; }
.settings { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.setting { display: flex; align-items: center; gap: 8px; }
.lab { font-size: 13px; color: var(--muted); }

.seg { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); }
.seg label { position: relative; }
.seg input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.seg span { display: block; padding: 6px 13px; border-radius: 999px; font-size: 14px; font-weight: 500; color: var(--muted); white-space: nowrap; }
.seg input:checked + span { background: var(--ink); color: var(--paper); }
.seg input:focus-visible + span { outline: 2px solid var(--axis); outline-offset: 2px; }
.seg input:disabled { cursor: not-allowed; }
.seg input:disabled + span { opacity: 0.5; }

.check { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; min-height: 40px; }
.check input { width: 18px; height: 18px; margin: 0; accent-color: var(--axis); }

.btn {
  font: 500 14px var(--font-body);
  min-height: 44px;
  padding: 8px 16px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  cursor: pointer;
}
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn:focus-visible { outline: 2px solid var(--axis); outline-offset: 2px; }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); font: 400 22px var(--font-display); padding: 8px 30px; border-radius: 999px; min-width: 150px; }
.btn.primary:hover:not(:disabled) { border-color: var(--ink); opacity: 0.88; }
.btn.solid { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.link { border-color: transparent; background: transparent; color: var(--muted); text-decoration: underline; padding-inline: 8px; }

/* 잠금 표시줄과 번호 입력 */
.lockbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 6px 6px 6px 16px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); }
.lockinfo { font-size: 14px; color: var(--muted); }
.lockinfo b { color: var(--ink); font-weight: 700; margin-right: 6px; }
.pinbox { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; padding: 12px 16px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
.pinbox label { font-size: 14px; }
.pinbox input { width: 7.5ch; font: 700 22px var(--font-body); letter-spacing: 0.35em; text-align: center; padding: 6px 4px 6px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink); }
.pinbox input:focus-visible { outline: 2px solid var(--axis); outline-offset: 2px; }
.pinmsg { font-size: 13.5px; color: var(--bad); }

/* 가운데 진행 줄 */
.stage {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  grid-template-areas: "round clock go" "msg msg msg" "rank rank rank";
  align-items: center;
  gap: 6px 16px;
  padding: 12px 18px 12px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
}
.round { grid-area: round; display: flex; align-items: baseline; gap: 8px; }
.round .k { color: var(--muted); font-size: 13px; letter-spacing: 0.06em; }
.round b { font: 400 30px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.clock { grid-area: clock; font: 400 52px/1 var(--font-display); font-variant-numeric: tabular-nums; text-align: center; min-width: 5.5ch; }
#go { grid-area: go; justify-self: end; }
.msg { grid-area: msg; margin: 0; text-align: center; color: var(--muted); font-size: 14px; min-height: 1.5em; text-wrap: balance; }
.rank { grid-area: rank; list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.rank li { display: inline-flex; align-items: baseline; gap: 8px; padding: 5px 14px 5px 10px; border-radius: 999px; background: var(--pc); color: var(--pf); font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; }
.rank .n { font: 400 20px/1 var(--font-display); }
.rank .nm { font-weight: 700; max-width: 9em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank .pt { font: 400 17px/1 var(--font-display); padding-left: 6px; border-left: 1px solid color-mix(in srgb, var(--pf) 45%, transparent); }

/* 보드 격자 */
.boards { display: grid; gap: 16px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.boards.n3, .boards.n5, .boards.n6 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.panel {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 12px 14px 14px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
}
.p0 { --pc: var(--p0); }
.p1 { --pc: var(--p1); }
.p2 { --pc: var(--p2); }
.p3 { --pc: var(--p3); }
.p4 { --pc: var(--p4); }
.p5 { --pc: var(--p5); }
.panel.won { border-color: var(--pc); box-shadow: 0 0 0 1px var(--pc); }

.phead { display: flex; align-items: center; gap: 10px; }
.swatch { flex: none; width: 30px; height: 7px; border-radius: 99px; background: var(--pc); }
.pname {
  flex: 1;
  min-width: 0;
  font: 500 17px var(--font-body);
  color: var(--ink);
  background: transparent;
  border: 0;
  border-bottom: 1px dashed var(--line);
  padding: 4px 2px;
  border-radius: 0;
}
.pname:read-only { border-bottom-color: transparent; cursor: default; }
.pname:focus-visible { outline: 2px solid var(--axis); outline-offset: 2px; }
.score { display: flex; align-items: baseline; gap: 4px; }
.score .num { font: 400 34px/1 var(--font-display); color: var(--pc); font-variant-numeric: tabular-nums; }
.score .unit { color: var(--muted); font-size: 13px; }

.board-wrap { position: relative; width: 100%; margin-inline: auto; }
.boards.n2 .board-wrap { width: min(100%, max(320px, calc(100svh - 380px))); }
.boards.n4 .board-wrap { width: min(100%, 460px); }
.board-wrap svg { display: block; width: 100%; height: auto; touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; cursor: pointer; }
.b-bg { fill: var(--board); }
.axis { stroke: var(--axis); stroke-width: 2.5; stroke-dasharray: 7 6; }
.axis-label { font: 700 12px var(--font-body); fill: var(--axis); }
.peg { fill: var(--peg); }
.axis-peg { fill: var(--axis); }
.given { fill: none; stroke: var(--ink); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
.given-dot { fill: var(--ink); }
.answer { stroke: var(--ok); stroke-width: 5; stroke-dasharray: 1 10; stroke-linecap: round; }
.wrong { stroke: var(--bad); stroke-width: 5; stroke-dasharray: 8 6; stroke-linecap: round; }
.band { stroke: var(--pc); stroke-width: 6; stroke-linecap: round; opacity: 0.94; }
.joint { fill: var(--pc); }
.sel { fill: none; stroke: var(--pc); stroke-width: 3.5; transform-box: fill-box; transform-origin: center; }
@media (prefers-reduced-motion: no-preference) {
  .sel { animation: pulse 1.1s ease-in-out infinite; }
}
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.25); } }

.veil {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 24px;
  text-align: center;
  border-radius: 3.4%;
  background: var(--board);
  background: color-mix(in srgb, var(--board) 84%, transparent);
  color: var(--ink);
  font: 400 24px/1.4 var(--font-display);
  white-space: pre-line;
  pointer-events: none;
}
.veil.big { font-size: clamp(72px, 14vw, 150px); line-height: 1; }
.badge {
  position: absolute;
  top: 3.5%;
  left: 50%;
  transform: translateX(-50%);
  padding: 6px 18px;
  border-radius: 999px;
  font: 400 22px/1.3 var(--font-display);
  white-space: nowrap;
  pointer-events: none;
}
.badge.win { background: var(--pc); color: var(--pf); }
.badge.lose { background: var(--card); color: var(--muted); border: 1px solid var(--line); }

.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.prog { margin-left: auto; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.help { margin: 0; text-align: center; color: var(--muted); font-size: 13.5px; text-wrap: balance; }
.help + .help { margin-top: -8px; }

@media (max-width: 1000px) {
  .boards.n3, .boards.n5, .boards.n6 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 720px) {
  .boards, .boards.n3, .boards.n5, .boards.n6 { grid-template-columns: minmax(0, 1fr); }
  .stage { grid-template-columns: 1fr auto; grid-template-areas: "round go" "clock clock" "msg msg" "rank rank"; }
  .clock { font-size: 46px; }
  h1 { font-size: 28px; }
}
</style>

<main class="app" id="app">
  <header class="top">
    <div class="title">
      <h1>선대칭 지오보드 대결</h1>
      <p>대칭축 한쪽에 있는 그림을 보고, 건너편에 같은 모양을 실로 먼저 완성하세요.</p>
    </div>
    <div class="ctl">
      <div class="settings" id="settings">
        <div class="setting">
          <span class="lab">참가 인원</span>
          <div class="seg" role="radiogroup" aria-label="참가 인원">
            <label><input type="radio" name="np" value="2" checked><span>2명</span></label>
            <label><input type="radio" name="np" value="3"><span>3명</span></label>
            <label><input type="radio" name="np" value="4"><span>4명</span></label>
            <label><input type="radio" name="np" value="5"><span>5명</span></label>
            <label><input type="radio" name="np" value="6"><span>6명</span></label>
          </div>
        </div>
        <div class="setting">
          <span class="lab">난이도</span>
          <div class="seg" role="radiogroup" aria-label="난이도">
            <label><input type="radio" name="lv" value="easy" checked><span>쉬움</span></label>
            <label><input type="radio" name="lv" value="mid"><span>보통</span></label>
            <label><input type="radio" name="lv" value="hard"><span>어려움</span></label>
            <label><input type="radio" name="lv" value="all"><span>섞어서</span></label>
          </div>
        </div>
        <div class="setting">
          <span class="lab">1등 뒤 마감</span>
          <div class="seg" role="radiogroup" aria-label="1등이 나온 뒤 남은 친구의 마감 시간">
            <label><input type="radio" name="dl" value="0"><span>바로</span></label>
            <label><input type="radio" name="dl" value="30" checked><span>30초</span></label>
            <label><input type="radio" name="dl" value="60"><span>60초</span></label>
            <label><input type="radio" name="dl" value="-1"><span>없음</span></label>
          </div>
        </div>
        <label class="check"><input type="checkbox" id="hint"><span>틀린 선 알려주기</span></label>
        <button class="btn" id="resetScore" type="button">점수 초기화</button>
        <button class="btn solid" id="lockBtn" type="button">설정 잠그기</button>
        <button class="btn link" id="pinChange" type="button" hidden>번호 변경</button>
      </div>
      <div class="lockbar" id="lockbar" hidden>
        <span class="lockinfo" id="lockInfo"></span>
        <button class="btn" id="unlockBtn" type="button">잠금 해제</button>
      </div>
    </div>
  </header>

  <form class="pinbox" id="pinForm" hidden autocomplete="off">
    <label for="pinInput" id="pinLabel">번호 4자리</label>
    <input id="pinInput" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off">
    <button class="btn solid" id="pinOk" type="submit">확인</button>
    <button class="btn" id="pinCancel" type="button">취소</button>
    <span class="pinmsg" id="pinMsg" aria-live="polite"></span>
  </form>

  <section class="stage" aria-label="대결 진행">
    <div class="round"><span class="k">라운드</span><b id="roundNo">-</b></div>
    <div class="clock" id="clock">0.0초</div>
    <button class="btn primary" id="go" type="button">시작</button>
    <p class="msg" id="msg" aria-live="polite"></p>
    <ol class="rank" id="rank" hidden></ol>
  </section>

  <div class="boards n2" id="boards"></div>

  <p class="help">핀을 차례로 누르면 실이 이어져요. 같은 핀을 한 번 더 누르면 실을 멈추고, 다른 핀에서 새로 시작할 수 있어요.</p>
  <p class="help" id="scoreHelp"></p>
</main>

<script id="core">
/* 퍼즐 데이터와 판정 규칙. 11x11 핀, 좌표는 [열, 행]이고 행은 위에서 아래로 늘어난다. */
const MAXI = 10;

/* 대칭축 네 종류: v 세로(x=5), h 가로(y=5), d1 왼쪽 위에서 오른쪽 아래로 가는 대각선(y=x), d2 오른쪽 위에서 왼쪽 아래로 가는 대각선(x+y=10) */
const AXES = {
  v:  { mirror: (x, y) => [MAXI - x, y],        on: (x, y) => x === 5,         side: (x, y) => x - 5 },
  h:  { mirror: (x, y) => [x, MAXI - y],        on: (x, y) => y === 5,         side: (x, y) => y - 5 },
  d1: { mirror: (x, y) => [y, x],               on: (x, y) => x === y,         side: (x, y) => y - x },
  d2: { mirror: (x, y) => [MAXI - y, MAXI - x], on: (x, y) => x + y === MAXI,  side: (x, y) => x + y - MAXI }
};

/* 각 도형은 대칭축 위의 점에서 시작해 대칭축 위의 점으로 끝나는 한쪽 절반의 꺾은선이다.
   ax가 없으면 세로축 도형(왼쪽 절반), ax가 d1이면 대각선축 도형(y=x 아래쪽 절반)이다.
   실제 문제로 만들 때 세로축 도형은 가로축 문제로도 바뀌고, 방향과 위치를 무작위로 바꾼다. */
const PUZZLES = {
  easy: [
    { n: '집',         p: [[5,1],[2,4],[2,9],[5,9]] },
    { n: '마름모',     p: [[5,1],[1,5],[5,9]] },
    { n: '연',         p: [[5,0],[2,4],[5,10]] },
    { n: '화살표',     p: [[5,1],[1,5],[3,5],[3,9],[5,9]] },
    { n: '정사각형',   ax: 'd1', p: [[2,2],[2,8],[8,8]] },
    { n: '직각삼각형', ax: 'd1', p: [[2,2],[2,8],[5,5]] },
    { n: '비스듬한 연', ax: 'd1', p: [[1,1],[3,6],[8,8]] },
    { n: 'ㄱ자',       ax: 'd1', p: [[1,1],[1,8],[3,8],[3,3]] }
  ],
  mid: [
    { n: '보석',   p: [[5,1],[3,1],[0,4],[5,10]] },
    { n: '전나무', p: [[5,1],[3,4],[4,4],[2,7],[4,7],[4,9],[5,9]] },
    { n: '하트',   p: [[5,3],[4,1],[2,1],[0,3],[0,5],[5,10]] },
    { n: '산',     p: [[5,1],[3,5],[2,4],[0,9],[5,9]] },
    { n: '플러스', p: [[5,1],[3,1],[3,3],[1,3],[1,7],[3,7],[3,9],[5,9]] },
    { n: '왕관',   p: [[5,1],[4,4],[2,1],[1,5],[1,9],[5,9]] },
    { n: '계단',   ax: 'd1', p: [[1,1],[1,9],[3,9],[3,7],[5,7],[5,5]] },
    { n: '큰 십자', ax: 'd1', p: [[4,4],[1,4],[1,6],[4,6],[4,9],[6,9],[6,6]] }
  ],
  hard: [
    { n: '별',     p: [[5,0],[4,3],[0,3],[3,5],[1,9],[5,7]] },
    { n: '나비',   p: [[5,3],[3,1],[0,1],[1,5],[0,9],[3,9],[5,7]] },
    { n: '로켓',   p: [[5,0],[3,3],[3,7],[1,9],[1,10],[3,9],[5,9]] },
    { n: '성',     p: [[5,2],[4,2],[4,0],[2,0],[2,2],[0,2],[0,10],[5,10]] },
    { n: '큰 화살', ax: 'd1', p: [[2,2],[1,3],[4,6],[3,7],[7,7]] },
    { n: '비스듬한 하트', ax: 'd1', p: [[1,1],[1,5],[2,7],[4,8],[5,5]] }
  ]
};

/* 실제로 내는 문제로 바꾼다. flags(a, b, c)를 주면 그 값대로 고정하고, 없으면 무작위다.
   세로축 도형: b가 거짓이면 세로축 문제(a가 참이면 위아래 뒤집기), 참이면 가로축 문제(c가 참이면 아래쪽 절반, a가 참이면 좌우 뒤집기).
   대각선 도형: a가 참이면 축의 반대쪽 절반, b가 참이면 / 방향 축. */
function instantiate(src, flags) {
  const f = flags || { a: Math.random() < 0.5, b: Math.random() < 0.5, c: Math.random() < 0.5 };
  let pts = src.p.map(p => [p[0], p[1]]);
  const ax = src.ax || 'v';
  if (ax === 'v') {
    if (!f.b) {
      if (f.a) pts = pts.map(p => [p[0], MAXI - p[1]]);
      return { n: src.n, ax: 'v', pts };
    }
    pts = pts.map(p => [p[1], p[0]]);
    if (f.c) pts = pts.map(p => [p[0], MAXI - p[1]]);
    if (f.a) pts = pts.map(p => [MAXI - p[0], p[1]]);
    return { n: src.n, ax: 'h', pts };
  }
  if (f.a) pts = pts.map(p => [p[1], p[0]]);
  let out = 'd1';
  if (f.b) { pts = pts.map(p => [MAXI - p[0], p[1]]); out = 'd2'; }
  return { n: src.n, ax: out, pts };
}

function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a; }
function edgeKey(x1, y1, x2, y2) {
  if (x1 > x2 || (x1 === x2 && y1 > y2)) { const tx = x1, ty = y1; x1 = x2; y1 = y2; x2 = tx; y2 = ty; }
  return x1 + ',' + y1 + '-' + x2 + ',' + y2;
}
function parseKey(k) {
  const [a, b] = k.split('-');
  const [x1, y1] = a.split(',').map(Number);
  const [x2, y2] = b.split(',').map(Number);
  return { x1, y1, x2, y2 };
}
/* 선분을 핀 사이의 가장 짧은 조각으로 나눈다. 긴 선 하나와 이어 붙인 짧은 선들이 같은 모양으로 취급된다. 대칭축 위의 조각은 비교에서 뺀다. */
function primEdges(segs, ax) {
  const on = AXES[ax].on;
  const set = new Set();
  for (const s of segs) {
    const ax0 = s[0][0], ay0 = s[0][1], bx = s[1][0], by = s[1][1];
    const dx = bx - ax0, dy = by - ay0;
    const g = gcd(dx, dy);
    if (g === 0) continue;
    const sx = dx / g, sy = dy / g;
    for (let i = 0; i < g; i++) {
      const x1 = ax0 + sx * i, y1 = ay0 + sy * i, x2 = x1 + sx, y2 = y1 + sy;
      if (on(x1, y1) && on(x2, y2)) continue;
      set.add(edgeKey(x1, y1, x2, y2));
    }
  }
  return set;
}
function chainSegs(pts) { return pts.slice(1).map((p, i) => [pts[i], p]); }
function mirrorSegs(segs, ax) {
  const m = AXES[ax].mirror;
  return segs.map(s => [m(s[0][0], s[0][1]), m(s[1][0], s[1][1])]);
}
function targetEdges(pts, ax) { return primEdges(mirrorSegs(chainSegs(pts), ax), ax); }
function judge(playerSegs, target, ax) {
  const mine = primEdges(playerSegs, ax);
  let ok = 0;
  const bad = [];
  for (const k of mine) { if (target.has(k)) ok++; else bad.push(k); }
  return { ok, total: target.size, bad, done: bad.length === 0 && ok === target.size };
}
/* 순위 점수는 제친 친구 수다. 못 끝낸 친구는 0점이다. */
function rankPoints(players, rank) { return players - rank; }
function subjectParticle(name) {
  const c = name.charCodeAt(name.length - 1);
  if (c >= 0xAC00 && c <= 0xD7A3) return (c - 0xAC00) % 28 === 0 ? '가' : '이';
  return '이(가)';
}
function fmtTime(ms) {
  const s = ms / 1000;
  if (s < 60) return s.toFixed(1) + '초';
  const m = Math.floor(s / 60);
  return m + '분 ' + (s - m * 60).toFixed(1) + '초';
}
function hashPin(s) {
  let x = 5381;
  const str = 'geoboard:' + s;
  for (let i = 0; i < str.length; i++) x = ((x << 5) + x + str.charCodeAt(i)) >>> 0;
  return x.toString(36);
}
</script>

<script id="app">
(function () {
  var CELL = 40, PAD = 34, VB = PAD * 2 + CELL * 10, MAXP = 6;
  var SVGNS = 'http://www.w3.org/2000/svg';
  var CFG_KEY = 'geoboard.cfg', PIN_KEY = 'geoboard.pin', LOCK_KEY = 'geoboard.locked';
  var LV_LABEL = { easy: '쉬움', mid: '보통', hard: '어려움', all: '섞어서' };
  function dlLabel(d) { return d === 0 ? '1등이 나오면 바로 끝' : d < 0 ? '마감 시간 없음' : '1등 뒤 ' + d + '초'; }

  function $(id) { return document.getElementById(id); }
  function px(v) { return PAD + v * CELL; }
  function el(tag, attrs, parent) {
    var e = document.createElementNS(SVGNS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 저장할 수 없어도 게임은 계속된다 */ } }

  var np = 2;
  var level = 'easy';
  var dl = 30; /* 1등 뒤 마감(초). 0이면 바로, -1이면 없음 */
  var locked = false;
  var pinHash = lsGet(PIN_KEY);
  var pinMode = null; /* set | setlock | unlock */
  var phase = 'idle'; /* idle | count | play | done */
  var bag = [];
  var last = null;
  var puzzle = null;
  var round = 0;
  var scores = [0, 0, 0, 0, 0, 0];
  var order = [];
  var finished = [false, false, false, false, false, false];
  var deadlineAt = 0;
  var lastLive = '';
  var t0 = 0, timerId = null, cdId = null;
  var B = [];

  function each(fn) { for (var i = 0; i < np; i++) fn(i); }
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pickPuzzle() {
    if (!bag.length) {
      var src = level === 'all' ? PUZZLES.easy.concat(PUZZLES.mid, PUZZLES.hard) : PUZZLES[level];
      bag = shuffle(src.slice());
      if (last && bag.length > 1 && bag[bag.length - 1] === last) {
        var t = bag[0]; bag[0] = bag[bag.length - 1]; bag[bag.length - 1] = t;
      }
    }
    last = bag.pop();
    var p = instantiate(last);
    p.target = targetEdges(p.pts, p.ax);
    return p;
  }

  function panelHTML(i) {
    return '' +
      '<div class="phead">' +
        '<span class="swatch" aria-hidden="true"></span>' +
        '<input class="pname" id="name' + i + '" type="text" maxlength="8" aria-label="' + (i + 1) + '번 자리 이름">' +
        '<div class="score"><span class="num" id="score' + i + '">0</span><span class="unit">점</span></div>' +
      '</div>' +
      '<div class="board-wrap">' +
        '<svg id="svg' + i + '" viewBox="0 0 ' + VB + ' ' + VB + '" role="img" aria-label="' + (i + 1) + '번 지오보드"></svg>' +
        '<div class="veil" id="veil' + i + '"></div>' +
        '<div class="badge" id="badge' + i + '" hidden></div>' +
      '</div>' +
      '<div class="tools">' +
        '<button class="btn" id="undo' + i + '" type="button">되돌리기</button>' +
        '<button class="btn" id="clear' + i + '" type="button">모두 지우기</button>' +
        '<span class="prog" id="prog' + i + '" hidden></span>' +
      '</div>';
  }

  function initBoard(i) {
    var section = document.createElement('section');
    section.className = 'panel p' + i;
    section.id = 'panel' + i;
    section.innerHTML = panelHTML(i);
    section.hidden = i >= np;
    $('boards').appendChild(section);
    $('name' + i).value = (i + 1) + '번 친구';
    $('name' + i).addEventListener('change', saveCfg);

    var svg = $('svg' + i);
    el('rect', { x: 0, y: 0, width: VB, height: VB, rx: 16, 'class': 'b-bg' }, svg);
    var axisG = el('g', {}, svg);
    var pegs = [];
    for (var y = 0; y <= 10; y++) {
      pegs[y] = [];
      for (var x = 0; x <= 10; x++) {
        pegs[y][x] = el('circle', { cx: px(x), cy: px(y), r: 4, 'class': 'peg' }, svg);
      }
    }
    var L = {};
    ['given', 'answer', 'wrong', 'player', 'sel'].forEach(function (n) { L[n] = el('g', {}, svg); });
    B[i] = { svg: svg, L: L, axisG: axisG, pegs: pegs, segs: [], cur: null, hist: [] };
    renderAxis(i, 'v');

    svg.addEventListener('pointerdown', function (e) { e.preventDefault(); onTap(i, e); });
    $('undo' + i).addEventListener('click', function () { undo(i); });
    $('clear' + i).addEventListener('click', function () { clearBoard(i); });
  }

  function names() {
    var out = [];
    for (var i = 0; i < MAXP; i++) out.push($('name' + i).value.trim() || ((i + 1) + '번 친구'));
    return out;
  }

  /* 그리기 */
  function renderAxis(i, ax) {
    var b = B[i];
    b.axisG.replaceChildren();
    var label;
    var a0 = px(-0.35), a1 = px(10.35);
    if (ax === 'v') {
      el('line', { x1: px(5), y1: PAD - 12, x2: px(5), y2: px(10) + 12, 'class': 'axis' }, b.axisG);
      label = el('text', { x: px(5), y: 15, 'text-anchor': 'middle', 'class': 'axis-label' }, b.axisG);
    } else if (ax === 'h') {
      el('line', { x1: a0, y1: px(5), x2: a1, y2: px(5), 'class': 'axis' }, b.axisG);
      label = el('text', { x: VB - 4, y: px(5) - 8, 'text-anchor': 'end', 'class': 'axis-label' }, b.axisG);
    } else if (ax === 'd1') {
      el('line', { x1: a0, y1: a0, x2: a1, y2: a1, 'class': 'axis' }, b.axisG);
      label = el('text', { x: 4, y: 14, 'text-anchor': 'start', 'class': 'axis-label' }, b.axisG);
    } else {
      el('line', { x1: a1, y1: a0, x2: a0, y2: a1, 'class': 'axis' }, b.axisG);
      label = el('text', { x: VB - 4, y: 14, 'text-anchor': 'end', 'class': 'axis-label' }, b.axisG);
    }
    label.textContent = '대칭축';
    b.svg.setAttribute('data-axis', ax);
    var on = AXES[ax].on;
    for (var y = 0; y <= 10; y++) {
      for (var x = 0; x <= 10; x++) {
        var isOn = on(x, y);
        b.pegs[y][x].setAttribute('class', isOn ? 'peg axis-peg' : 'peg');
        b.pegs[y][x].setAttribute('r', isOn ? 5 : 4);
      }
    }
  }
  function renderGiven(i, show) {
    var g = B[i].L.given;
    g.replaceChildren();
    if (!show || !puzzle) return;
    var pts = puzzle.pts.map(function (p) { return px(p[0]) + ',' + px(p[1]); }).join(' ');
    el('polyline', { points: pts, 'class': 'given' }, g);
    puzzle.pts.forEach(function (p) { el('circle', { cx: px(p[0]), cy: px(p[1]), r: 4.5, 'class': 'given-dot' }, g); });
  }
  function renderAnswer(i, show) {
    var g = B[i].L.answer;
    g.replaceChildren();
    if (!show || !puzzle) return;
    mirrorSegs(chainSegs(puzzle.pts), puzzle.ax).forEach(function (s) {
      el('line', { x1: px(s[0][0]), y1: px(s[0][1]), x2: px(s[1][0]), y2: px(s[1][1]), 'class': 'answer' }, g);
    });
  }
  function renderPlayer(i) {
    var b = B[i];
    b.L.player.replaceChildren();
    b.L.wrong.replaceChildren();
    b.L.sel.replaceChildren();
    b.segs.forEach(function (s) {
      el('line', { x1: px(s[0][0]), y1: px(s[0][1]), x2: px(s[1][0]), y2: px(s[1][1]), 'class': 'band' }, b.L.player);
    });
    b.segs.forEach(function (s) {
      el('circle', { cx: px(s[1][0]), cy: px(s[1][1]), r: 3.5, 'class': 'joint' }, b.L.player);
    });
    if (b.cur) el('circle', { cx: px(b.cur[0]), cy: px(b.cur[1]), r: 11, 'class': 'sel' }, b.L.sel);

    var prog = $('prog' + i);
    var hintOn = $('hint').checked && puzzle && (phase === 'play' || phase === 'done');
    if (hintOn) {
      var j = judge(b.segs, puzzle.target, puzzle.ax);
      j.bad.forEach(function (k) {
        var e = parseKey(k);
        el('line', { x1: px(e.x1), y1: px(e.y1), x2: px(e.x2), y2: px(e.y2), 'class': 'wrong' }, b.L.wrong);
      });
      prog.textContent = '맞은 선 ' + j.ok + ' / ' + j.total;
      prog.hidden = false;
    } else {
      prog.hidden = true;
    }
  }

  /* 입력 */
  function snapshot(i) {
    var b = B[i];
    b.hist.push({ segs: b.segs.slice(), cur: b.cur });
  }
  function onTap(i, e) {
    if (phase !== 'play' || finished[i]) return;
    var b = B[i];
    var r = b.svg.getBoundingClientRect();
    if (!r.width) return;
    var sx = (e.clientX - r.left) * VB / r.width;
    var sy = (e.clientY - r.top) * VB / r.height;
    var gx = Math.round((sx - PAD) / CELL), gy = Math.round((sy - PAD) / CELL);
    if (gx < 0 || gx > 10 || gy < 0 || gy > 10) return;
    if (Math.hypot(sx - px(gx), sy - px(gy)) > CELL * 0.75) return;
    snapshot(i);
    if (!b.cur) {
      b.cur = [gx, gy];
    } else if (b.cur[0] === gx && b.cur[1] === gy) {
      b.cur = null;
    } else {
      b.segs.push([b.cur, [gx, gy]]);
      b.cur = [gx, gy];
    }
    renderPlayer(i);
    if (judge(b.segs, puzzle.target, puzzle.ax).done) complete(i);
  }
  function undo(i) {
    if (phase !== 'play' || finished[i]) return;
    var b = B[i];
    var h = b.hist.pop();
    if (!h) return;
    b.segs = h.segs;
    b.cur = h.cur;
    renderPlayer(i);
  }
  function clearBoard(i) {
    if (phase !== 'play' || finished[i]) return;
    var b = B[i];
    if (!b.segs.length && !b.cur) return;
    snapshot(i);
    b.segs = [];
    b.cur = null;
    renderPlayer(i);
  }

  /* 진행 */
  function setClock(ms) { $('clock').textContent = fmtTime(ms); }
  function setMsg(t) { $('msg').textContent = t; }
  function showVeil(i, text, big) {
    var v = $('veil' + i);
    v.textContent = text;
    v.className = 'veil' + (big ? ' big' : '');
    v.hidden = false;
  }
  function hideVeils() { each(function (i) { $('veil' + i).hidden = true; }); }
  function scoreHelp() {
    $('scoreHelp').textContent = '점수는 제친 친구 수예요. 지금은 ' + np + '명이라 1등 ' + (np - 1) + '점, 2등 ' + (np - 2) + '점, … 못 끝내면 0점이에요.';
  }
  function syncUI() {
    var go = $('go');
    var play = phase === 'play';
    go.disabled = phase === 'count' || (play && locked);
    go.title = play && locked ? '설정이 잠겨 있어요. 선생님이 잠금을 풀면 누를 수 있어요.' : '';
    go.textContent = phase === 'idle' ? '시작' : phase === 'count' ? '준비' : play ? (order.length ? '라운드 마치기' : '건너뛰기') : '다음 문제';
    for (var i = 0; i < MAXP; i++) {
      var off = !play || finished[i];
      $('undo' + i).disabled = off;
      $('clear' + i).disabled = off;
    }
    document.querySelectorAll('input[name="np"]').forEach(function (r) { r.disabled = phase === 'count' || play; });
    $('roundNo').textContent = round || '-';
  }

  function renderRank(final) {
    var ol = $('rank');
    ol.replaceChildren();
    if (!order.length) { ol.hidden = true; return; }
    var nm = names();
    order.forEach(function (o, idx) {
      var li = document.createElement('li');
      li.className = 'p' + o.i;
      var n = document.createElement('span'); n.className = 'n'; n.textContent = (idx + 1) + '등';
      var name = document.createElement('span'); name.className = 'nm'; name.textContent = nm[o.i];
      var tm = document.createElement('span'); tm.className = 'tm'; tm.textContent = fmtTime(o.ms);
      li.appendChild(n); li.appendChild(name); li.appendChild(tm);
      if (final) {
        var pt = document.createElement('span'); pt.className = 'pt'; pt.textContent = '+' + rankPoints(np, idx + 1);
        li.appendChild(pt);
      }
      ol.appendChild(li);
    });
    ol.hidden = false;
  }

  function resetToIdle() {
    clearTimeout(cdId);
    clearInterval(timerId);
    phase = 'idle';
    puzzle = null;
    order = [];
    finished = [false, false, false, false, false, false];
    deadlineAt = 0;
    setClock(0);
    for (var i = 0; i < MAXP; i++) {
      var b = B[i];
      b.segs = []; b.cur = null; b.hist = [];
      renderAxis(i, 'v');
      renderGiven(i, false);
      renderAnswer(i, false);
      renderPlayer(i);
      $('badge' + i).hidden = true;
      $('panel' + i).classList.remove('won');
      showVeil(i, '시작 버튼을 누르면\n문제가 나타나요', false);
    }
    renderRank(false);
    setMsg('같은 문제를 모든 보드에 동시에 보여 줘요. 먼저 완성한 순서대로 순위를 매겨요.');
    scoreHelp();
    syncUI();
  }
  function setPlayers(n) {
    np = n;
    $('boards').className = 'boards n' + n;
    $('app').classList.toggle('wide', n >= 3);
    for (var i = 0; i < MAXP; i++) $('panel' + i).hidden = i >= n;
    resetToIdle();
  }

  function beginRound() {
    puzzle = pickPuzzle();
    round++;
    phase = 'count';
    order = [];
    finished = [false, false, false, false, false, false];
    deadlineAt = 0;
    lastLive = '';
    setClock(0);
    each(function (i) {
      var b = B[i];
      b.segs = []; b.cur = null; b.hist = [];
      renderAxis(i, puzzle.ax);
      renderGiven(i, false);
      renderAnswer(i, false);
      renderPlayer(i);
      $('badge' + i).hidden = true;
      $('panel' + i).classList.remove('won');
      showVeil(i, '3', true);
    });
    renderRank(false);
    setMsg('준비하세요! 곧 그림이 나타나요.');
    syncUI();
    var n = 3;
    function tick() {
      n--;
      if (n > 0) {
        each(function (i) { showVeil(i, String(n), true); });
        cdId = setTimeout(tick, 1000);
      } else {
        startPlay();
      }
    }
    cdId = setTimeout(tick, 1000);
  }
  function startPlay() {
    phase = 'play';
    hideVeils();
    each(function (i) { renderGiven(i, true); renderPlayer(i); });
    setMsg('대칭축 건너편에 같은 모양을 실로 걸어요. 핀을 차례로 눌러요.');
    t0 = performance.now();
    timerId = setInterval(onTick, 100);
    syncUI();
  }
  function onTick() {
    var now = performance.now();
    setClock(now - t0);
    if (deadlineAt && now >= deadlineAt) { endRound(); return; }
    if (order.length) liveMsg(now);
  }
  function liveMsg(now) {
    var nm = names();
    var first = nm[order[0].i];
    var text = first + subjectParticle(first) + ' 1등! ';
    if (deadlineAt) text += '남은 친구는 ' + Math.max(0, Math.ceil((deadlineAt - now) / 1000)) + '초 안에 마무리하세요.';
    else text += '남은 친구가 끝날 때까지 기다려요.';
    if (text !== lastLive) { lastLive = text; setMsg(text); }
  }

  function complete(i) {
    if (phase !== 'play' || finished[i]) return;
    var ms = performance.now() - t0;
    finished[i] = true;
    order.push({ i: i, ms: ms });
    B[i].cur = null;
    renderPlayer(i);
    var rank = order.length;
    var bd = $('badge' + i);
    bd.className = 'badge win';
    bd.textContent = rank === 1 ? '1등! ' + fmtTime(ms) : rank + '등 ' + fmtTime(ms);
    bd.hidden = false;
    if (rank === 1) $('panel' + i).classList.add('won');
    renderRank(false);
    if (order.length === np) { endRound(); return; }
    if (rank === 1) {
      if (dl === 0) { endRound(); return; }
      if (dl > 0) deadlineAt = performance.now() + dl * 1000;
    }
    liveMsg(performance.now());
    syncUI();
  }
  function endRound() {
    if (phase !== 'play') return;
    phase = 'done';
    clearInterval(timerId);
    deadlineAt = 0;
    setClock(performance.now() - t0);
    var nm = names();
    each(function (i) { B[i].cur = null; renderPlayer(i); });
    if (!order.length) {
      each(function (i) { renderAnswer(i, true); });
      setMsg('이번 라운드는 건너뛰었어요. 정답은 초록 점선이에요. 도형 이름: ' + puzzle.n);
    } else {
      order.forEach(function (o, idx) {
        scores[o.i] += rankPoints(np, idx + 1);
        $('score' + o.i).textContent = scores[o.i];
      });
      var unfinished = 0;
      each(function (i) {
        if (finished[i]) return;
        unfinished++;
        var lb = $('badge' + i);
        lb.className = 'badge lose';
        lb.textContent = '시간 끝';
        lb.hidden = false;
        renderAnswer(i, true);
      });
      var first = nm[order[0].i];
      setMsg(first + subjectParticle(first) + ' 1등! 도형 이름: ' + puzzle.n + '.' + (unfinished ? ' 못 끝낸 보드에는 정답이 초록 점선으로 나와요.' : ''));
    }
    renderRank(true);
    syncUI();
  }

  /* 설정 저장 */
  function saveCfg() {
    lsSet(CFG_KEY, JSON.stringify({ np: np, level: level, dl: dl, hint: $('hint').checked, names: names() }));
  }
  function loadCfg() {
    var raw = lsGet(CFG_KEY);
    if (!raw) return null;
    try { return JSON.parse(raw); } catch (e) { return null; }
  }
  function setRadio(name, value) {
    document.querySelectorAll('input[name="' + name + '"]').forEach(function (r) { r.checked = r.value === String(value); });
  }

  /* 선생님 잠금 */
  function applyLock() {
    $('settings').hidden = locked;
    $('lockbar').hidden = !locked;
    $('pinChange').hidden = !pinHash;
    $('lockInfo').replaceChildren();
    var b = document.createElement('b'); b.textContent = '설정 잠김';
    $('lockInfo').appendChild(b);
    $('lockInfo').appendChild(document.createTextNode(np + '명 · ' + LV_LABEL[level] + ' · ' + dlLabel(dl)));
    for (var i = 0; i < MAXP; i++) $('name' + i).readOnly = locked;
    syncUI();
  }
  function doLock() {
    locked = true;
    lsSet(LOCK_KEY, '1');
    saveCfg();
    applyLock();
  }
  var pinWrong = 0, pinWait = null;
  function openPin(mode) {
    pinMode = mode;
    $('pinLabel').textContent = mode === 'unlock' ? '잠금 번호를 입력하세요' : '잠금 번호 4자리를 정해 주세요. 풀 때 이 번호가 필요해요';
    $('pinOk').textContent = mode === 'unlock' ? '해제' : '저장';
    $('pinMsg').textContent = '';
    $('pinInput').value = '';
    $('pinForm').hidden = false;
    $('pinInput').focus();
  }
  function closePin() {
    pinMode = null;
    $('pinForm').hidden = true;
    $('pinInput').value = '';
  }
  function lockout(sec) {
    $('pinInput').disabled = true;
    $('pinOk').disabled = true;
    clearInterval(pinWait);
    var left = sec;
    $('pinMsg').textContent = '번호가 여러 번 틀렸어요. ' + left + '초 뒤에 다시 해 주세요.';
    pinWait = setInterval(function () {
      left--;
      if (left <= 0) {
        clearInterval(pinWait);
        pinWrong = 0;
        $('pinInput').disabled = false;
        $('pinOk').disabled = false;
        $('pinMsg').textContent = '';
        $('pinInput').focus();
      } else {
        $('pinMsg').textContent = '번호가 여러 번 틀렸어요. ' + left + '초 뒤에 다시 해 주세요.';
      }
    }, 1000);
  }
  $('pinForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = $('pinInput').value.trim();
    if (!/^\d{4}$/.test(v)) { $('pinMsg').textContent = '숫자 4자리를 입력하세요.'; return; }
    if (pinMode === 'unlock') {
      if (hashPin(v) === pinHash) {
        locked = false;
        lsSet(LOCK_KEY, '0');
        pinWrong = 0;
        closePin();
        applyLock();
      } else {
        pinWrong++;
        $('pinInput').value = '';
        if (pinWrong >= 3) lockout(15);
        else $('pinMsg').textContent = '번호가 달라요.';
      }
    } else {
      pinHash = hashPin(v);
      lsSet(PIN_KEY, pinHash);
      var lockAfter = pinMode === 'setlock';
      closePin();
      if (lockAfter) doLock(); else applyLock();
    }
  });
  $('pinCancel').addEventListener('click', closePin);
  $('lockBtn').addEventListener('click', function () {
    if (!pinHash) openPin('setlock'); else doLock();
  });
  $('pinChange').addEventListener('click', function () { openPin('set'); });
  $('unlockBtn').addEventListener('click', function () { openPin('unlock'); });

  /* 버튼과 설정 */
  $('go').addEventListener('click', function () {
    if (phase === 'idle' || phase === 'done') beginRound();
    else if (phase === 'play' && !locked) endRound();
  });
  $('resetScore').addEventListener('click', function () {
    if (locked) return;
    scores = [0, 0, 0, 0, 0, 0];
    round = phase === 'idle' ? 0 : round;
    for (var i = 0; i < MAXP; i++) {
      $('score' + i).textContent = '0';
      $('panel' + i).classList.remove('won');
    }
    syncUI();
  });
  $('hint').addEventListener('change', function () { each(renderPlayer); saveCfg(); });
  document.querySelectorAll('input[name="lv"]').forEach(function (r) {
    r.addEventListener('change', function () { if (r.checked) { level = r.value; bag = []; saveCfg(); } });
  });
  document.querySelectorAll('input[name="dl"]').forEach(function (r) {
    r.addEventListener('change', function () { if (r.checked) { dl = parseInt(r.value, 10); saveCfg(); } });
  });
  document.querySelectorAll('input[name="np"]').forEach(function (r) {
    r.addEventListener('change', function () { if (r.checked) { setPlayers(parseInt(r.value, 10)); saveCfg(); } });
  });

  /* 시작 */
  var cfg = loadCfg();
  if (cfg) {
    if (cfg.np >= 2 && cfg.np <= MAXP) np = cfg.np;
    if (LV_LABEL[cfg.level]) level = cfg.level;
    if ([0, 30, 60, -1].indexOf(cfg.dl) >= 0) dl = cfg.dl;
    $('hint').checked = !!cfg.hint;
    setRadio('np', np); setRadio('lv', level); setRadio('dl', dl);
  }
  for (var k = 0; k < MAXP; k++) initBoard(k);
  if (cfg && cfg.names) {
    for (var q = 0; q < MAXP; q++) if (typeof cfg.names[q] === 'string' && cfg.names[q]) $('name' + q).value = cfg.names[q].slice(0, 8);
  }
  setPlayers(np);
  if (pinHash && lsGet(LOCK_KEY) === '1') locked = true;
  applyLock();
})();
</script>

</body></html>
